app-id: io.goreecloud.Browser
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: goreecloud-browser
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.portal.Desktop
modules:
  - name: goreecloud-browser
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DGOREECLOUD_ENABLE_LINUX_GTK_HOST=ON
      - -DGOREECLOUD_ENABLE_CHROMIUM=OFF
      - -DGOREECLOUD_ENABLE_CEF=OFF
      - -DGOREECLOUD_RELEASE_CHANNEL=beta
    sources:
      - type: dir
        path: ../..

# Beta shell manifest. It builds the visible GoreeCloud/Glaze GTK host and
# first-party Browser core, but intentionally leaves Chromium/CEF disabled
# until a reviewed CEF runtime module, sandbox, codecs, and runtime provenance
# are incorporated into the Flatpak build. It is not a render-capable browser
# package or production artifact yet.
