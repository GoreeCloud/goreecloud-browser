name: Browser sync contract

on:
  push:
    branches: [main]
    paths:
      - "include/goreecloud/browser/sync_capabilities.hpp"
      - "include/goreecloud/browser/sync_manifest.hpp"
      - "include/goreecloud/browser/sync_records.hpp"
      - "include/goreecloud/browser/sync_submission.hpp"
      - "apps/browser/sync_capabilities_smoke.cpp"
      - "apps/browser/sync_manifest_smoke.cpp"
      - "apps/browser/sync_records_smoke.cpp"
      - "apps/browser/sync_submission_smoke.cpp"
      - ".github/workflows/sync-contract.yml"
  pull_request:
    paths:
      - "include/goreecloud/browser/sync_capabilities.hpp"
      - "include/goreecloud/browser/sync_manifest.hpp"
      - "include/goreecloud/browser/sync_records.hpp"
      - "include/goreecloud/browser/sync_submission.hpp"
      - "apps/browser/sync_capabilities_smoke.cpp"
      - "apps/browser/sync_manifest_smoke.cpp"
      - "apps/browser/sync_records_smoke.cpp"
      - "apps/browser/sync_submission_smoke.cpp"
      - ".github/workflows/sync-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile capability contract
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude apps/browser/sync_capabilities_smoke.cpp -o /tmp/browser-sync-capabilities
      - name: Run capability contract
        run: /tmp/browser-sync-capabilities
      - name: Compile service manifest contract
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude apps/browser/sync_manifest_smoke.cpp -o /tmp/browser-sync-manifest
      - name: Run service manifest contract
        run: /tmp/browser-sync-manifest
      - name: Compile privacy-safe record contract
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude apps/browser/sync_records_smoke.cpp -o /tmp/browser-sync-records
      - name: Run privacy-safe record contract
        run: /tmp/browser-sync-records
      - name: Compile submission contract
        run: g++ -std=c++20 -Wall -Wextra -Wpedantic -Iinclude apps/browser/sync_submission_smoke.cpp -o /tmp/browser-sync-submission
      - name: Run submission contract
        run: /tmp/browser-sync-submission
