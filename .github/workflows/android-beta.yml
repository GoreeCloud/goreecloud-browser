name: GoreeCloud Browser Android Beta APK

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "docs/ANDROID_BETA.md"
      - ".github/workflows/android-beta.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "docs/ANDROID_BETA.md"
      - ".github/workflows/android-beta.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  android-beta:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact Browser source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Verify exact Browser source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test, lint, and assemble beta
        working-directory: apps/android
        shell: bash
        run: |
          gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      # A material Android behavior change gets a distinct debug-beta identity.
      - name: Verify APK signature, identity, and pseudolocales
        shell: bash
        run: |
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          BADGING="apps/android/app/build/outputs/apk/debug/badging.txt"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$BADGING"
          grep -F "package: name='io.goreecloud.browser.beta'" "$BADGING"
          grep -F "versionCode='10017'" "$BADGING"
          grep -F "versionName='0.1.0-beta.1+android.17'" "$BADGING"
          grep -F "application-label:'GoreeCloud Browser Beta'" "$BADGING"
          grep -F "application-label-ar-XB:" "$BADGING"
          grep -F "application-label-en-XA:" "$BADGING"
          grep -F "locales:" "$BADGING" | grep -F "'ar-XB'" | grep -F "'en-XA'"

      - name: Record SHA-256 and source revision
        shell: bash
        run: |
          cd apps/android/app/build/outputs/apk/debug
          sha256sum app-debug.apk | tee SHA256SUMS.txt
          printf '%s\n' "$SOURCE_REVISION" > SOURCE_REVISION

      - name: Upload installable beta APK
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-browser-android-beta-${{ env.SOURCE_REVISION }}
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/SHA256SUMS.txt
            apps/android/app/build/outputs/apk/debug/SOURCE_REVISION
            apps/android/app/build/outputs/apk/debug/badging.txt
