<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GoreeCloud Browser — Borealis Lens Candidate</title>
  <desc id="desc">A compact faceted lens made from three converging sails around a clear central aperture.</desc>
  <defs>
