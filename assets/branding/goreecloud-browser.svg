<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GoreeCloud Browser — Tidefold Candidate</title>
  <desc id="desc">An asymmetric interlocking fold mark built from two broad planes and a central negative channel.</desc>
