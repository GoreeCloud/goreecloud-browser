<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GoreeCloud Browser — Horizon Portal</title>
  <desc id="desc">A minimal open circular portal crossed by a forward horizon path, expressing web navigation, openness, and forward movement.</desc>
  <defs>
    <linearGradient id="foundation" x1="170" y1="116" x2="858" y2="908" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#172B63"/>
      <stop offset="0.52" stop-color="#315ED8"/>
      <stop offset="1" stop-color="#7246D8"/>
    </linearGradient>
    <linearGradient id="portal" x1="284" y1="250" x2="744" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE8FF"/>
    </linearGradient>
    <filter id="depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#08183D" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#foundation)"/>

  <g filter="url(#depth)">
    <path d="M512 226C348 226 216 358 216 522C216 686 348 818 512 818C650 818 766 724 800 596H694C664 664 596 712 516 712C410 712 324 626 324 520C324 414 410 328 516 328C594 328 662 374 694 440H800C764 316 650 226 512 226Z" fill="url(#portal)"/>

    <path d="M262 522C350 458 448 430 552 438C626 444 696 468 762 510L704 574C650 544 596 528 540 526C450 522 368 548 294 604L262 522Z" fill="#FFFFFF"/>

    <path d="M650 430L814 510L682 624L704 574L762 510L694 476L650 430Z" fill="#FFFFFF"/>
  </g>

  <circle cx="512" cy="520" r="54" fill="#315ED8"/>
  <circle cx="512" cy="520" r="24" fill="#FFFFFF"/>
</svg>
