<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">GoreeCloud Browser — Glaze Navigation Ribbon</title>
  <desc id="desc">A layered navigation ribbon forming a forward-moving compass shape inside a rounded Glaze UI application tile.</desc>
  <defs>
    <linearGradient id="foundation" x1="144" y1="96" x2="872" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A7BFF"/>
      <stop offset="0.48" stop-color="#695CFF"/>
      <stop offset="1" stop-color="#A34DFF"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="286" y1="238" x2="760" y2="782" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.55" stop-color="#F4F7FF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#DCE6FF" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="inner" x1="402" y1="350" x2="638" y2="674" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E55D4"/>
      <stop offset="1" stop-color="#7B3FE4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#17204A" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#foundation)"/>
  <path d="M184 300C294 168 472 112 640 150C760 177 858 250 912 350C822 282 716 252 608 264C420 284 276 396 208 552C176 494 158 430 158 364C158 342 166 320 184 300Z"
        fill="#FFFFFF" opacity="0.10"/>
  <path d="M806 770C690 884 504 924 340 868C240 834 160 772 112 694C202 746 306 766 408 748C598 714 734 588 790 424C830 484 852 554 852 626C852 680 836 730 806 770Z"
        fill="#FFFFFF" opacity="0.08"/>

  <g filter="url(#softShadow)">
    <path d="M286 512C286 372 394 258 532 248C640 240 744 296 802 390L698 430C656 366 584 330 510 340C420 352 352 426 352 516C352 620 436 704 540 704C620 704 690 656 722 584L806 638C758 740 654 810 534 810C396 810 282 704 270 568C268 548 274 530 286 512Z"
          fill="url(#ribbon)"/>
    <path d="M458 320L790 388L626 526L558 706L458 320Z" fill="url(#ribbon)"/>
    <path d="M520 398L690 432L604 504L568 598L520 398Z" fill="url(#inner)"/>
  </g>

  <circle cx="514" cy="516" r="54" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="514" cy="516" r="24" fill="#5B55F4"/>

  <path d="M268 204C388 122 548 102 690 150" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="18" stroke-linecap="round"/>
</svg>
